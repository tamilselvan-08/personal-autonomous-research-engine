# Development override: hot reload for API and web, Postgres reachable on 127.0.0.1:5432.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      args:
        INSTALL_DEV: "true"
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    environment:
      LOG_FORMAT: text
    volumes:
      - ./apps/api:/app
    user: root

  web:
    build:
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      # File change events do not cross from Windows into containers reliably.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    mem_limit: 1g

volumes:
  web_node_modules:
  web_next:
