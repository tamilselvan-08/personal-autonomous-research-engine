# PARE local stack. Ports are bound to 127.0.0.1 so the app is not exposed to your network.
#   docker compose up -d --build          # production-like images
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build   # hot reload
name: pare

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pare
      POSTGRES_USER: pare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run scripts/setup-env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pare -d pare"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://pare:${POSTGRES_PASSWORD}@postgres:5432/pare
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (run scripts/setup-env)}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    mem_limit: 512m
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    mem_limit: 512m

volumes:
  pgdata:
