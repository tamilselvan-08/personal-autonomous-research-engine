[project]
name = "pare-api"
version = "0.1.0"
description = "Personal Autonomous Research Engine - API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.4,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "bcrypt>=5.0,<6",
    "PyJWT>=2.15,<3",
    "cryptography>=50,<51",
    "httpx>=0.28,<1",
    "litellm>=1.111,<2",
    "openai>=3.60,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=6",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Raised by pydantic for TypedDicts inside LiteLLM itself when it is imported.
    "ignore:Items? .* using the `ReadOnly` qualifier:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"alembic/**" = ["E501"]
